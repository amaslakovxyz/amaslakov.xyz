---
- name: Sync Python dependencies (frozen lockfile)
  ansible.builtin.command:
    argv: ["{{ blog_xyz_uv_bin }}", sync, --frozen]
    chdir: "{{ blog_xyz_service_root }}"
  changed_when: true

- name: Restart service
  ansible.builtin.command:
    argv: [sudo, systemctl, restart, "{{ blog_xyz_service_name }}"]
  changed_when: true
