<!doctype html>
<html lang="en" data-site="{{ site.site_id }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ site.title }}{% endblock %}</title>
  <meta name="description" content="{{ site.tagline }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="/feed.xml">
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/{{ site.site_id }}.css">
  <script>(function(){var s=localStorage.getItem('theme');if(s)document.documentElement.dataset.theme=s;})();</script>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">{{ site.title }}</a>
    <nav>
      <a href="/{{ site.collection }}">{{ site.collection }}</a>
      <a href="/feed.xml">rss</a>
      <button type="button" class="theme-toggle" aria-label="Toggle theme" onclick="toggleTheme()">◐</button>
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
  <footer class="site-footer">© {{ site.author }} · <a href="/feed.xml">feed</a></footer>
  <script>
    function toggleTheme(){var r=document.documentElement;var n=r.dataset.theme==='dark'?'light':'dark';r.dataset.theme=n;localStorage.setItem('theme',n);}
  </script>
</body>
</html>
