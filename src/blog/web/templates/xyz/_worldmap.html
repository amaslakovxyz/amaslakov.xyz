<figure class="worldmap">
  <figcaption class="wm-cap"><span class="c">~</span> locate --me</figcaption>
  <div class="wm-wrap">
<pre class="wm" aria-hidden="true">                       ·······
                       ·······          ·························
   ·····  ············ ·······    ····  ·························

              ····            ··········   ················

                   ·····      ···········         ·········
                   ········   ···········         ·········
                   ········   ···········
                   ········        ·····             ········
                   ····            ·····             ········
                   ····            ·····             ········
                   ····
                   ····
                   ····</pre>
    <span class="wm-pin" style="left:calc(.6rem + 41.5ch);top:calc(.6rem + 5.5em)">◉</span>
  </div>
  <p class="wm-loc">{% if site.location %}<span class="pin">◉</span> {{ site.location.label }} <span class="dim">{{ site.location.coords }}</span>{% endif %}</p>
</figure>
